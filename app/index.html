<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="theme-color" content="#f7f7f6" />
    <link rel="icon" href="./icone.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icone-192.png" />
    <meta name="viewport" content="width=device-width, initial-width=1" />
    <title>Sections en béton armé — vérification à l'ELU et en service, EN 1992-1-1</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <!--
      La barre de la suite : nom de la suite a gauche, un seul lien vers le
      carrefour a droite. Un lien unique, c'est la surface d'echec minimale
      quand la page est ouverte hors ligne.
    -->
    <div class="barre">
      <span>Aedificium</span>
      <span class="barre-actions">
        <a
          href="https://henri421.github.io/WebAedificium/"
          target="_blank"
          rel="noopener"
          >Outils EC2 &#8599;</a
        >
        <a class="barre-langue" href="en/" hreflang="en" lang="en" aria-label="English version">EN</a>
      </span>
    </div>

    <header>
      <h1>Sections en béton armé</h1>
    </header>

    <!--
      Trois colonnes qui commencent toutes EN HAUT : la saisie a gauche, les
      traces au milieu, le resultat a droite. Le dessin et le diagramme sont
      reunis dans une meme colonne parce qu'ils montrent la meme section vue
      autrement, et parce qu'ils doivent defiler ENSEMBLE : c'est ce qui evite
      que le dessin, colle en haut de l'ecran, masque le diagramme.
    -->
    <main>
      <section id="saisie" aria-label="saisie de la section"></section>
      <div class="visuels">
        <section id="section" aria-label="trace de la section"></section>
        <section id="diagramme" aria-label="diagrammes d interaction"></section>
      </div>
      <section id="resultat" aria-label="resultat de la verification"></section>
    </main>

    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
